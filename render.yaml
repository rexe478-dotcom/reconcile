services:
  - type: web
    name: reconcile-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: reconcile_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000,https://*.github.io,https://*.netlify.app,https://*.vercel.app"
