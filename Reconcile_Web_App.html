    // State Variables
    let subscriptions = loadSubscriptions();
    let viewMode = 'phone'; // 'phone' | 'all4' | 'desktop'
    let currentScreen = 'home'; // 'onboarding' | 'home' | 'subscriptions' | 'details'

    let toastMessage = null;

    function loadSubscriptions() {
      try {
        const saved = localStorage.getItem('reconcile_subscriptions_v2');
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return [...INITIAL_SUBSCRIPTIONS];
    }

    function saveSubscriptions() {
      try {
        localStorage.setItem('reconcile_subscriptions_v2', JSON.stringify(subscriptions));
      } catch (e) {}
    }

    function showToast(msg) {
      toastMessage = msg;
      render();
      setTimeout(() => {
        toastMessage = null;
        render();
      }, 2500);
    }

    function getSelectedSubscription() {
      return subscriptions.find(s => s.id === selectedSubId) || subscriptions[0];
    }

    function calculateTotalMonthlySpend() {
      const active = subscriptions.filter(s => s.status !== 'cancelled');
      let total = 0;
      for (const s of active) {
        if (s.interval === 'year') total += s.amount / 12;
        else if (s.interval === 'week') total += (s.amount * 52) / 12;
        else total += s.amount;
      }
      return Math.round(total);
    }

                <button onclick="openGmailModal()" class="w-full mt-3 py-2 px-3 rounded-full bg-[#3D5438] text-white font-bold text-xs">Connect Gmail</button>
              </div>
            </div>

            <div class="bg-white rounded-3xl border border-[#E5E0D8] p-6 space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-[#171717]">All Subscriptions</h3>
                <span class="text-xs text-[#737373]">${subscriptions.length} total entries</span>
              </div>
              <div class="divide-y divide-[#E5E0D8]">
                ${subscriptions.map(s => `
                  <div onclick="selectSubscriptionAndGoDetails('${s.id}')" class="py-3 flex items-center justify-between hover:bg-[#FAF8F5] px-2 rounded-xl cursor-pointer">
                    <div class="flex items-center gap-3">
                      ${renderBrandIcon(s.providerName, 36)}
                      <div>
                        <div class="text-sm font-bold text-[#171717]">${s.providerName}</div>
                        <div class="text-xs text-[#737373]">${s.planName} · ${s.nextRenewalDate}</div>
                      </div>
                    </div>
                    <div class="flex items-center gap-3">
                      <span class="text-sm font-black text-[#171717]">₦${s.amount.toLocaleString()}</span>
                      <span class="text-[10px] font-bold px-2.5 py-1 rounded-full ${s.status === 'needs_review' ? 'bg-[#FDEEE2] text-[#C2671A]' : 'bg-[#E2EBD8] text-[#3D5438]'}">
                        ${s.status === 'needs_review' ? 'Needs review' : 'Active'}
                      </span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      app.innerHTML = `
        <!-- Top Toolbar -->
        <header class="sticky top-0 z-40 bg-[#FAF8F5]/95 backdrop-blur-md border-b border-[#E5E0D8] px-4 py-2.5">
          <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-lg bg-[#3D5438] flex items-center justify-center text-white font-black text-sm shadow-sm">R</div>
              <div>
                <span class="font-extrabold tracking-[0.18em] text-sm text-[#171717] block leading-none">RECONCILE</span>
                <span class="text-[10px] text-[#737373] font-medium hidden sm:inline">Know What Renews Next</span>
              </div>
            </div>

            <!-- Mode Switcher -->
            <div class="flex items-center bg-[#F0ECE4] p-1 rounded-full border border-[#E5E0D8] text-xs font-bold">
              <button onclick="setViewMode('phone')" class="px-3 py-1.5 rounded-full transition-all ${viewMode === 'phone' ? 'bg-white text-[#3D5438] shadow-xs' : 'text-[#737373] hover:text-[#171717]'}">
                📱 Interactive Phone
              </button>
              <button onclick="setViewMode('all4')" class="px-3 py-1.5 rounded-full transition-all ${viewMode === 'all4' ? 'bg-white text-[#3D5438] shadow-xs' : 'text-[#737373] hover:text-[#171717]'}">
                🖼 All 4 Screens View
              </button>
              <button onclick="setViewMode('desktop')" class="hidden md:inline px-3 py-1.5 rounded-full transition-all ${viewMode === 'desktop' ? 'bg-white text-[#3D5438] shadow-xs' : 'text-[#737373] hover:text-[#171717]'}">
                💻 Desktop View
              </button>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-2">
              <button onclick="resetDemoData()" title="Reset to reference demo data" class="p-2 rounded-full bg-white hover:bg-[#F0ECE4] border border-[#E5E0D8] text-[#737373] transition-colors">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
              </button>
              <button onclick="openAddModal()" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-[#3D5438] hover:bg-[#32462E] text-white font-bold text-xs shadow-sm transition-all active:scale-95">
                <span>+ Add Subscription</span>
              </button>
            </div>
          </div>
        </header>

        <!-- Main Body -->
        <main class="flex-1 flex flex-col justify-center py-6 px-4">
          ${mainContent}
        </main>

        <!-- Modals -->
        ${renderModals()}

        <!-- Toast -->
        ${toastMessage ? `
          <div class="fixed bottom-6 right-6 z-50 px-4 py-2.5 rounded-full bg-[#3D5438] text-white font-bold text-xs shadow-xl animate-in slide-in-from-bottom duration-200">
            ${toastMessage}
          </div>
        ` : ''}
      `;
    }

    // --- Modals Renderer ---
    function renderModals() {
      let html = '';

      // Add/Edit Modal
      if (isAddEditOpen) {
        const isEditing = !!editingSub;
        html += `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs">
            <div class="relative w-full max-w-lg rounded-3xl bg-[#FAF8F5] border border-[#E5E0D8] shadow-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto text-[#171717]">
              <div class="flex items-center justify-between pb-2 border-b border-[#E5E0D8]">
                <h3 class="font-extrabold text-base">${isEditing ? 'Edit Subscription' : 'Add Subscription'}</h3>
                <button onclick="closeAddEditModal()" class="p-1 rounded-full hover:bg-[#EFECE4] text-[#737373]">✕</button>
              </div>

              <form onsubmit="handleSaveForm(event)" class="space-y-3 text-xs">
                <div>
                  <label class="block font-semibold mb-1">Provider Name *</label>
                  <input id="formProvider" type="text" required value="${isEditing ? editingSub.providerName : ''}" placeholder="e.g. Netflix, Spotify" class="w-full bg-white border border-[#E5E0D8] focus:border-[#3D5438] rounded-xl px-3 py-2 outline-none text-sm" />
                </div>
                <div>
                  <label class="block font-semibold mb-1">Plan Name / Notes</label>
                  <input id="formPlan" type="text" value="${isEditing ? (editingSub.planName || editingSub.notes || '') : ''}" placeholder="e.g. Premium Family" class="w-full bg-white border border-[#E5E0D8] focus:border-[#3D5438] rounded-xl px-3 py-2 outline-none text-sm" />
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block font-semibold mb-1">Amount (₦) *</label>
                    <input id="formAmount" type="number" required value="${isEditing ? editingSub.amount : 2500}" class="w-full bg-white border border-[#E5E0D8] focus:border-[#3D5438] rounded-xl px-3 py-2 outline-none text-sm" />
                  </div>
                  <div>
                    <label class="block font-semibold mb-1">Recurrence</label>
                    <select id="formInterval" class="w-full bg-white border border-[#E5E0D8] focus:border-[#3D5438] rounded-xl px-3 py-2 outline-none text-sm">
                      <option value="month" ${isEditing && editingSub.interval === 'month' ? 'selected' : ''}>Monthly</option>
                      <option value="year" ${isEditing && editingSub.interval === 'year' ? 'selected' : ''}>Annual</option>
                    </select>
                  </div>
                </div>
                <div>
                  <label class="block font-semibold mb-1">Next Expected Renewal *</label>
                  <input id="formDate" type="date" required value="${isEditing ? editingSub.nextRenewalDate : '2025-05-15'}" class="w-full bg-white border border-[#E5E0D8] focus:border-[#3D5438] rounded-xl px-3 py-2 outline-none text-sm" />
                </div>
                <div class="flex items-center justify-between pt-3 border-t border-[#E5E0D8]">
                  ${isEditing ? `<button type="button" onclick="handleDeleteSub('${editingSub.id}')" class="px-3 py-1.5 rounded-full bg-red-50 text-red-600 font-bold border border-red-200">Delete</button>` : '<div></div>'}
                  <div class="flex items-center gap-2">
                    <button type="button" onclick="closeAddEditModal()" class="px-4 py-2 rounded-full bg-white border border-[#D8D2C6] font-semibold">Cancel</button>
                    <button type="submit" class="px-5 py-2 rounded-full bg-[#3D5438] text-white font-bold">Save</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      // Cancellation Modal
      if (isCancelOpen && cancellingSub) {
        html += `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs">
            <div class="relative w-full max-w-md rounded-3xl bg-[#FAF8F5] border border-[#E5E0D8] shadow-2xl p-6 space-y-4 text-[#171717]">
              <div class="flex items-center justify-between pb-2 border-b border-[#E5E0D8]">
                <h3 class="font-extrabold text-base">Cancel ${cancellingSub.providerName}</h3>
                <button onclick="closeCancelModal()" class="p-1 rounded-full hover:bg-[#EFECE4] text-[#737373]">✕</button>
              </div>
              <div class="p-3.5 rounded-2xl bg-[#FFF4E5] border border-[#FDE0B6] text-xs text-[#7B4109]">
                <strong>Official Cancellation Handoff:</strong> We guide you directly to the verified provider portal. We never claim background cancellation.
              </div>
              <div class="space-y-1.5 text-xs text-[#171717]">
                <div class="font-bold">Instructions:</div>
                <div>1. Log into your verified ${cancellingSub.providerName} account.</div>
                <div>2. Go to Subscription / Billing Management.</div>
                <div>3. Select Cancel Plan and confirm your choice.</div>
              </div>
              <div class="pt-2 flex flex-col gap-2">
                <a href="${cancellingSub.cancellationUrl || 'https://google.com'}" target="_blank" class="w-full py-3 rounded-full bg-[#3D5438] hover:bg-[#32462E] text-white text-center font-bold text-xs">
                  Open Official ${cancellingSub.providerName} Page ↗
                </a>
                <button onclick="confirmCancelled('${cancellingSub.id}')" class="w-full py-2.5 rounded-full bg-red-50 text-red-700 font-bold text-xs border border-red-200">
                  Mark as Cancelled in Reconcile
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // Gmail OAuth Modal
      if (isGmailOpen) {
        html += `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs">
            <div class="relative w-full max-w-md rounded-3xl bg-[#FAF8F5] border border-[#E5E0D8] shadow-2xl p-6 space-y-4 text-[#171717]">
              <div class="flex items-center justify-between pb-2 border-b border-[#E5E0D8]">
                <h3 class="font-extrabold text-base">Gmail Subscription Discovery</h3>
                <button onclick="closeGmailModal()" class="p-1 rounded-full hover:bg-[#EFECE4] text-[#737373]">✕</button>
              </div>
              <div class="p-3.5 rounded-2xl bg-white border border-[#E5E0D8] text-xs space-y-2">
                <div class="font-bold text-[#3D5438]">🔒 Consent & Privacy Overview</div>
                <div class="text-[#737373] leading-relaxed">
                  We use read-only OAuth scopes to find subscription receipts. We never see your password or retain private email messages.
                </div>
              </div>
              <button onclick="simulateGmailImport()" class="w-full py-3 rounded-full bg-[#3D5438] text-white font-bold text-xs shadow-sm">
                Import Sample Canva Pro Candidate
              </button>
            </div>
          </div>
        `;
      }

      return html;
    }

    // --- Action Handlers ---
    function setViewMode(mode) {
      viewMode = mode;
      render();
    }

    function navigateToScreen(screen) {
      currentScreen = screen;
      if (screen === 'home') activeBottomTab = 'home';
      else if (screen === 'subscriptions') activeBottomTab = 'explore';
      render();
    }

    function handleBottomTabChange(tab) {
      activeBottomTab = tab;
      if (tab === 'home') currentScreen = 'home';
      else if (tab === 'explore') currentScreen = 'subscriptions';
      else if (tab === 'saved') currentScreen = 'saved';
      else if (tab === 'profile') currentScreen = 'profile';
      render();
    }

    function selectSubscriptionAndGoDetails(id) {
      selectedSubId = id;
      currentScreen = 'details';
      render();
    }

    function toggleReminder(id) {
      subscriptions = subscriptions.map(s => s.id === id ? { ...s, remindersEnabled: !s.remindersEnabled } : s);
      saveSubscriptions();
      showToast('Reminder toggled.');
    }

    function setCategoryFilter(filter) {
      categoryFilter = filter;
      render();
    }

    function handleSearch(q) {
      searchQuery = q;
      render();
      const input = document.getElementById('htmlSearchInput');
      if (input) {
        input.focus();
        input.setSelectionRange(q.length, q.length);
      }
    }

    function focusSearch() {
      const input = document.getElementById('htmlSearchInput');
      if (input) input.focus();
    }

    function openAddModal() {
      editingSub = null;
      isAddEditOpen = true;
      render();
    }

    function openEditModalFor(id) {
      editingSub = subscriptions.find(s => s.id === id) || null;
      isAddEditOpen = true;
      render();
    }

    function closeAddEditModal() {
      isAddEditOpen = false;
      editingSub = null;
      render();
    }

    function handleSaveForm(e) {
      e.preventDefault();
      const provider = document.getElementById('formProvider').value.trim();
      const plan = document.getElementById('formPlan').value.trim();
      const amount = Number(document.getElementById('formAmount').value);
      const interval = document.getElementById('formInterval').value;
      const date = document.getElementById('formDate').value;

      if (!provider || !date) return;

      if (editingSub) {
        subscriptions = subscriptions.map(s => s.id === editingSub.id ? {
          ...s,
          providerName: provider,
          planName: plan,
          amount,
          interval,
          nextRenewalDate: date,
        } : s);
        showToast(`Updated "${provider}".`);
      } else {
        const newSub = {
          id: `sub-${Date.now()}`,
          providerName: provider,
          planName: plan || 'Standard Subscription',
          amount,
          currency: 'NGN',
          interval,
          nextRenewalDate: date,
          anchorDay: new Date(date).getUTCDate(),
          category: 'General',
          provenance: 'manual',
          status: 'active',
          remindersEnabled: true
        };
        subscriptions = [newSub, ...subscriptions];
        selectedSubId = newSub.id;
        showToast(`Added "${provider}".`);
      }

      saveSubscriptions();
      closeAddEditModal();
    }

    function handleDeleteSub(id) {
      subscriptions = subscriptions.filter(s => s.id !== id);
      saveSubscriptions();
      closeAddEditModal();
      currentScreen = 'subscriptions';
      showToast('Subscription deleted.');
    }

    function openCancellationModalFor(id) {
      cancellingSub = subscriptions.find(s => s.id === id) || null;
      isCancelOpen = true;
      render();
    }

    function closeCancelModal() {
      isCancelOpen = false;
      cancellingSub = null;
      render();
    }

    function confirmCancelled(id) {
      subscriptions = subscriptions.map(s => s.id === id ? { ...s, status: 'cancelled' } : s);
      saveSubscriptions();
      closeCancelModal();
      showToast('Marked as cancelled.');
    }

    function openGmailModal() {
      isGmailOpen = true;
      render();
    }

    function closeGmailModal() {
      isGmailOpen = false;
      render();
    }

    function simulateGmailImport() {
      const candidate = {
        id: `sub-canva-${Date.now()}`,
        providerName: 'Canva Pro',
        planName: 'Annual Design Suite',
        amount: 11000,
        currency: 'NGN',
        interval: 'year',
        nextRenewalDate: '2025-12-15',
        anchorDay: 15,
        category: 'Productivity',
        provenance: 'gmail',
        status: 'needs_review',
        remindersEnabled: true,
        cancellationUrl: 'https://www.canva.com/account-settings/billing-and-teams'
      };
      subscriptions = [candidate, ...subscriptions];
      saveSubscriptions();
      closeGmailModal();
      currentScreen = 'subscriptions';
      categoryFilter = 'needs_review';
      showToast('Imported Canva Pro candidate for review!');
    }

    function resetDemoData() {
      subscriptions = [...INITIAL_SUBSCRIPTIONS];
      saveSubscriptions();
      selectedSubId = 'sub-spotify';
      showToast('Reset to reference demo data.');
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(subscriptions, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `reconcile_subscriptions_${new Date().toISOString().split('T')[0]}.json`);
      dlAnchor.click();
    }

    // Initial Render
    render();
  </script>
</body>
</html>
